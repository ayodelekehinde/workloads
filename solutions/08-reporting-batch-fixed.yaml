apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-batch
  namespace: secure-apps
  labels:
    app.kubernetes.io/name: reporting-batch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting-batch
  template:
    metadata:
      labels:
        app: reporting-batch
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: reporting-worker
        image: python:3.11-alpine
        command:
        - python3
        - -c
        - |
          import http.server, socketserver
          class HealthHandler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'Reporting Batch OK')
          print("[Reporting-Batch] Listening on port 8080 for health checks...")
          with socketserver.TCPServer(('', 8080), HealthHandler) as httpd:
              httpd.serve_forever()
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        # Fixed resources to fit within LimitRange (max 2 CPUs, 2Gi memory)
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        # Fixed probe port to 8080
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
